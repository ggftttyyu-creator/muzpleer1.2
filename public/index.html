<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MuzPlayer — мультипровайдерный плеер</title>
<script>
  // Тема выставляется до первой отрисовки: если сделать это в app.js, при
  // загрузке успеет мигнуть палитра по умолчанию. Скрипт крошечный и
  // защищён try — при отключённом localStorage страница всё равно откроется.
  (function () {
    var fallback = 'aurora';
    try {
      var prefs = JSON.parse(localStorage.getItem('muz:prefs') || '{}');
      document.documentElement.dataset.theme = prefs.theme || fallback;
    } catch (e) {
      document.documentElement.dataset.theme = fallback;
    }
  })();
</script>
<link rel="stylesheet" href="/styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎧</text></svg>" />
</head>
<body>

<div class="app">
  <!-- ============ Сайдбар ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" width="20" height="20"><use href="#i-radio"/></svg></div>
      <div class="brand-text"><b>MuzPlayer</b><span>мульти-провайдерный плеер</span></div>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-view="search"><svg viewBox="0 0 24 24"><use href="#i-search"/></svg><span>Поиск</span></button>
      <button class="nav-item" data-view="trends"><svg viewBox="0 0 24 24"><use href="#i-sparkles"/></svg><span>Тренды</span></button>
      <button class="nav-item" data-view="radio"><svg viewBox="0 0 24 24"><use href="#i-radio"/></svg><span>Радио</span></button>
      <button class="nav-item" data-view="foryou"><svg viewBox="0 0 24 24"><use href="#i-sparkles"/></svg><span>Для вас</span></button>
      <button class="nav-item" data-view="favorites"><svg viewBox="0 0 24 24"><use href="#i-heart"/></svg><span>Избранное <i class="count" id="fav-count">0</i></span></button>
      <button class="nav-item" data-view="settings"><svg viewBox="0 0 24 24"><use href="#i-gear"/></svg><span>Настройки</span></button>
    </nav>

    <div class="side-block">
      <div class="side-title">Источники</div>
      <div class="sources" id="sources"></div>
    </div>

    <div class="side-foot">
      <span id="health">—</span>
      <button class="acc-mini" id="acc-mini" title="Аккаунты и ключи — в настройках"></button>
    </div>
  </aside>

  <!-- ============ Основная область ============ -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-row">
        <div class="searchbox">
          <svg viewBox="0 0 24 24"><use href="#i-search"/></svg>
          <input id="q" type="search" placeholder="Треки, артисты, радиостанции…" autocomplete="off" spellcheck="false" />
          <kbd>/</kbd>
        </div>
        <button class="icon-btn theme-btn" id="btn-theme" title="Тема оформления — открыть выбор (T)">
          <svg viewBox="0 0 24 24"><use href="#i-palette"/></svg>
        </button>
      </div>
      <div class="tabs" id="tabs"></div>
      <div class="theme-pop" id="theme-pop"></div>
    </header>

    <!-- Док встроенного плеера YouTube: API не отдаёт аудиопоток,
         поэтому видео играет здесь, а не через <audio> -->
    <div class="yt-dock" id="yt-dock">
      <div class="yt-head">
        <span class="yt-badge">YouTube</span>
        <span class="yt-title" id="yt-title">—</span>
        <button class="icon-btn" id="yt-collapse" title="Свернуть"><svg viewBox="0 0 24 24"><use href="#i-minus"/></svg></button>
        <button class="icon-btn" id="yt-close" title="Закрыть плеер"><svg viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
      </div>
      <div class="yt-frame" id="yt-frame"></div>
      <div class="yt-note" id="yt-note"></div>
    </div>

    <section class="content" id="content"></section>
  </main>

  <!-- ============ Караоке ============ -->
  <aside class="lyrics" id="lyrics-panel">
    <div class="queue-head">
      <b>Текст песни</b>
      <div>
        <span class="lyr-src" id="lyr-src"></span>
        <button class="icon-btn" id="lyrics-close"><svg viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
      </div>
    </div>
    <div class="lyr-body" id="lyr-body"></div>
  </aside>

  <!-- ============ Очередь ============ -->
  <aside class="queue" id="queue-panel">
    <div class="queue-head">
      <b>Очередь</b>
      <div>
        <button class="btn-mini" id="queue-autoplay" title="Автоподбор: когда очередь кончится, дополню её треками по вашему вкусу">Автоподбор</button>
        <button class="btn-mini" id="queue-clear">Очистить</button>
        <button class="icon-btn" id="queue-close"><svg viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
      </div>
    </div>
    <div class="queue-hint" id="queue-hint"></div>
    <div class="queue-list" id="queue-list"></div>
  </aside>

  <!-- ============ Плеер ============ -->
  <footer class="player" id="player">
    <div class="np">
      <div class="np-art" id="np-art"><svg viewBox="0 0 24 24"><use href="#i-radio"/></svg></div>
      <div class="np-meta">
        <div class="np-title" id="np-title">Ничего не играет</div>
        <div class="np-sub" id="np-sub">Выберите трек или станцию</div>
      </div>
      <button class="icon-btn fav" id="np-fav" title="В избранное"><svg viewBox="0 0 24 24"><use href="#i-heart"/></svg></button>
    </div>

    <div class="controls">
      <div class="buttons">
        <button class="icon-btn" id="btn-shuffle" title="Перемешивание: выкл → настоящий рандом → умный (S)"><svg viewBox="0 0 24 24"><use href="#i-shuffle"/></svg></button>
        <button class="icon-btn" id="btn-prev" title="Предыдущий (Shift+←)"><svg viewBox="0 0 24 24"><use href="#i-prev"/></svg></button>
        <button class="play-btn" id="btn-play" title="Play/Pause (Space)"><svg viewBox="0 0 24 24" id="play-icon"><use href="#i-play"/></svg></button>
        <button class="icon-btn" id="btn-next" title="Следующий (Shift+→)"><svg viewBox="0 0 24 24"><use href="#i-next"/></svg></button>
        <button class="icon-btn" id="btn-repeat" title="Повтор (R)"><svg viewBox="0 0 24 24"><use href="#i-repeat"/></svg></button>
      </div>
      <div class="timeline">
        <span class="t" id="t-cur">0:00</span>
        <div class="bar" id="bar"><div class="bar-buffer" id="bar-buffer"></div><div class="bar-fill" id="bar-fill"></div><div class="bar-knob" id="bar-knob"></div></div>
        <span class="t" id="t-total">0:00</span>
      </div>
    </div>

    <div class="right">
      <canvas id="viz" width="140" height="34" title="Визуализатор"></canvas>
      <button class="icon-btn" id="btn-mute" title="Звук (M)"><svg viewBox="0 0 24 24"><use href="#i-vol"/></svg></button>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" class="vol" />
      <button class="icon-btn" id="btn-lyrics" title="Текст песни / караоке (L)"><svg viewBox="0 0 24 24"><use href="#i-text"/></svg></button>
      <button class="icon-btn" id="btn-queue" title="Очередь (Q)"><svg viewBox="0 0 24 24"><use href="#i-queue"/></svg></button>
    </div>
  </footer>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <button class="icon-btn modal-x" id="modal-x"><svg viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
    <h3 id="modal-title">Вход в Яндекс.Музыку</h3>
    <div id="modal-body"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<audio id="audio" preload="metadata" crossorigin="anonymous"></audio>

<script type="module" src="/app.js"></script>
<script>
  // Сторожевой таймер. Если app.js не загрузился или упал до старта, пользователь
  // видел бы просто тёмную пустую страницу. Показываем диагноз вместо пустоты.
  // Скрипт встроенный — он работает даже когда внешние файлы не грузятся (превью в песочнице).
  (function () {
    window.__muzBoot = false;
    var detail = '';
    window.addEventListener(
      'error',
      function (e) {
        // Реагируем только на ошибки сценария: у сбоев загрузки картинок/шрифтов
        // текста нет, и ронять из-за них интерфейс нельзя.
        if (!e || !e.message) return;
        detail = e.message + (e.filename ? '  (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '');
        if (window.__muzFail) window.__muzFail(detail);
      },
      true,
    );
    setTimeout(function () {
      if (window.__muzBoot) return;
      var el = document.getElementById('content');
      if (!el) return;
      el.innerHTML =
        '<div class="empty" style="padding:48px 20px">' +
        '<div class="big">🧩</div>' +
        '<h4>Интерфейс не запустился</h4>' +
        '<p>Разметка и стили загрузились, а сценарий <code>app.js</code> — нет. Так бывает, когда ' +
        'браузер взял <b>старую копию файла из кэша</b> или страница открыта без работающего сервера.</p>' +
        '<p>1. Обновите страницу с полным сбросом кэша: <b>Ctrl + Shift + R</b> (Cmd + Shift + R).<br />' +
        '2. Если вы во встроенном превью — откройте <b>http://localhost:4173</b> в обычной вкладке браузера ' +
        '(в изолированном превью внешние скрипты могут блокироваться).</p>' +
        (detail ? '<p class="hint">Ошибка: ' + detail.replace(/[<>&]/g, '') + '</p>' : '') +
        '<p class="hint">Адрес: ' + location.href.replace(/[<>&]/g, '') + '</p>' +
        '</div>';
    }, 3500);
  })();
</script>
</body>
</html>
